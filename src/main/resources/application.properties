serpro.auth.consumer.key=jIXkCCyjmstrfZrdfYpAVUDoBwwa
serpro.auth.consumer.secret=zok1bpUdC3J7prqySh3C3JZHaQga
serpro.auth.token.url=https://gateway.apiserpro.serpro.gov.br/token

# Mostra logs detalhados do Demoiselle
#ogging.level.org.demoiselle.signer=DEBUG

# Mostra o tráfego das bibliotecas Apache HTTP (usadas internamente)
#logging.level.org.apache.http=DEBUG
#logging.level.org.apache.http.wire=DEBUG

# Datasource (H2 em arquivo por padrão; PostgreSQL configurável via variáveis de ambiente DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/digital_signature_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
# Dialeto explícito necessário: Hibernate 6.x não auto-detecta quando H2 usa MODE=PostgreSQL
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# Flyway (desativado no modo H2 padrão para evitar scripts específicos de Postgres; reativável via env var)
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

# Configurações do Scheduler de Limpeza de Jobs NeoID
neoid.job.retention-days=${NEOID_JOB_RETENTION_DAYS:7}
neoid.job.expire-interval=${NEOID_JOB_EXPIRE_INTERVAL:300000}

# NeoID (SerproID) - credenciais fornecidas pelo Serpro apos credenciamento
neoid.client-id=${NEOID_CLIENT_ID:PENDENTE_CREDENCIAMENTO_SERPRO}
neoid.client-secret=${NEOID_CLIENT_SECRET:PENDENTE_CREDENCIAMENTO_SERPRO}
neoid.authorization-endpoint=https://neoid.estaleiro.serpro.gov.br/oauth/authorize
neoid.token-endpoint=https://neoid.estaleiro.serpro.gov.br/oauth/token
neoid.signature-endpoint=https://neoid.estaleiro.serpro.gov.br/v1/signature
neoid.callback-url=${APP_URL:https://versign.versatecnologia.com.br}/api/v1/neoid/callback

